[project]
name = "keep-or-nah"
version = "0.1.0"
description = "Desktop photo triage app for quick keep-or-discard sorting"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "customtkinter>=5.2.2",
  "Pillow>=11.3.0",
  "tkinterdnd2-universal>=1.7.3",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.14.0",
  "maturin>=1.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
]
