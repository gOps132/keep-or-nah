[package]
name = "keep_or_nah_core"
version = "0.2.0"
edition = "2021"
authors = ["Keep or Nah Authors"]
description = "Native high-performance core engine for Keep or Nah photo triage"

[lib]
name = "keep_or_nah_core"
crate-type = ["rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon", "hdr", "exr", "qoi", "tga", "ico"] }
fast_image_resize = { version = "5", features = ["image"] }
kamadak-exif = "0.6"
filetime = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
lru = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
