# keep or nah - pre-commit hooks
#
# The hooks run deterministic checks before committing.
# A full verification run still happens in scripts/verify.sh and CI.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt-core
        name: cargo fmt core
        entry: cargo fmt --manifest-path crates/keep_or_nah_core/Cargo.toml --check
        language: system
        files: ^crates/keep_or_nah_core/.*\.rs$
        pass_filenames: false

      - id: cargo-fmt-tauri
        name: cargo fmt tauri
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        language: system
        files: ^src-tauri/.*\.rs$
        pass_filenames: false

      - id: no-junk-artifacts
        name: no build artifacts staged
        entry: scripts/agent/check-artifacts.sh
        language: system
        pass_filenames: false
