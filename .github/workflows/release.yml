name: Release

# Turns a `v*` tag into a published release with downloadable macOS and
# Windows artifacts using Tauri.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (without the leading v)"
        required: true
        type: string

permissions:
  contents: write

# The verification scripts are bash. Windows runners default to PowerShell,
# which cannot execute them, so every step runs under bash everywhere.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read the pinned Rust toolchain
        id: rust
        run: echo "version=$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run the full verification gate
        run: scripts/verify.sh

  macos:
    name: macos
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read the pinned Rust toolchain
        id: rust
        run: echo "version=$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/keep_or_nah_core
            src-tauri

      - name: Build macOS app bundle
        run: npx --prefix frontend tauri build

      - name: Package the macOS app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r "$GITHUB_WORKSPACE/Keep-or-Nah-macos.zip" "keep-or-nah.app" -x '*.DS_Store'
          cd "$GITHUB_WORKSPACE"

      - name: Upload the macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: keep-or-nah-macos
          path: Keep-or-Nah-macos.zip
          if-no-files-found: error

  windows:
    name: windows
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read the pinned Rust toolchain
        id: rust
        run: echo "version=$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/keep_or_nah_core
            src-tauri

      - name: Build Windows executable
        run: npx --prefix frontend tauri build

      - name: Package the Windows executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/*/*.exe, src-tauri/target/release/bundle/*/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-Item -Path src-tauri/target/release/keep-or-nah-app.exe
          }
          Compress-Archive -Path $installer.FullName -DestinationPath Keep-or-Nah-windows.zip

      - name: Upload the Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: keep-or-nah-windows
          path: Keep-or-Nah-windows.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download the macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: keep-or-nah-macos
          path: .

      - name: Download the Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: keep-or-nah-windows
          path: .

      - name: Collect the release notes
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${RELEASE_TAG}"
          else
            range="${RELEASE_TAG}"
          fi
          {
            echo "## Changes"
            echo
            git log --pretty=format:'- %s (%h)' "$range"
            echo
            echo
            echo "## Notes"
            echo
            echo "- The macOS app bundle is unsigned. macOS will quarantine the download on first launch."
            echo "- The Windows executable is unsigned. Windows SmartScreen will warn on first launch."
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Keep or Nah ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            Keep-or-Nah-macos.zip
            Keep-or-Nah-windows.zip
